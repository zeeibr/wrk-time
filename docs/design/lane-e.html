<style>
.le{display:flex;gap:30px}
.le *{box-sizing:border-box}
.shot{margin:0;flex:0 0 auto}
.dev{width:316px;height:666px;padding:8px;border-radius:46px;background:linear-gradient(160deg,#3a3d40,#17191a 40%,#2c2f31);box-shadow:0 2px 3px rgba(0,0,0,.4),0 30px 60px -30px rgba(0,0,0,.7);position:relative}
.dev__island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:86px;height:25px;border-radius:99px;background:#000;z-index:9}
.dev__screen{width:300px;height:650px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sysbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 24px 0;color:var(--sys-fg,#fff);font:600 13px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.homebar{flex:0 0 auto;height:24px;display:grid;place-items:center}
.homebar::after{content:"";width:112px;height:4px;border-radius:99px;background:var(--sys-fg,#fff);opacity:.4}

.le{--ink:#0F1A15;--moss:#35513F;--sage:#8FA894;--oat:#E9E5D9;--saff:#D9A227;
    --mute:#4A6252;--line:rgba(53,81,63,.20);--slab:Superclarendon,"American Typewriter",Charter,"Iowan Old Style",serif;
    --ui:-apple-system,"Avenir Next","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased}
.le :where(figure,h1,h2,h3,p,ul,li,dl,dd,dt,button,nav,a){margin:0;padding:0;list-style:none;
  border:0;background:none;color:inherit;font:inherit;text-decoration:none}
.le :where(b,strong){font-weight:600}
.le :where([class^="le-"],[class*=" le-"]){font-variant-numeric:tabular-nums}

.le .leS--1,.le .leS--2,.le .leS--3{--sys-fg:#0F1A15}
.le .leS--4{--sys-fg:#E9E5D9}
.le .leS--1,.le .leS--3{background:
  radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.55),transparent 60%),
  linear-gradient(178deg,#EFECE1 0%,#E9E5D9 46%,#E2DECF 100%)}
.le .leS--2{background:
  radial-gradient(140% 62% at 50% 8%,rgba(255,255,255,.60),transparent 62%),
  linear-gradient(180deg,#E7E3D6 0%,#E1DDCE 58%,#D8D5C5 100%)}
.le .leS--4{background:
  radial-gradient(120% 60% at 26% 6%,#22362B 0%,transparent 62%),
  linear-gradient(172deg,#16241C 0%,#0F1A15 55%,#0B120E 100%)}

.le-body{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.le-pad{padding:0 22px}

.le-eyebrow{font:600 10.6px/1.2 var(--mono);letter-spacing:.13em;color:var(--mute);
  text-transform:uppercase;font-size:11px}
.le-h1{font:400 23.5px/1.15 var(--slab);letter-spacing:-.012em;color:var(--ink)}
.le-h2{font:400 19px/1.2 var(--slab);letter-spacing:-.008em}
.le-sub{font:400 12.5px/1.45 var(--ui);color:var(--mute)}

/* ---------- growth form ---------- */
.le-form{display:block;overflow:visible}
.le-form--hero{width:174px;height:174px}
.le-form--thumb{width:102px;height:102px;flex:0 0 102px;margin-left:-3px}
.le-form--mini{width:42px;height:42px}
.le-form--lock{width:34px;height:34px}

/* ---------- screen 1 ---------- */
.le-hd{padding-top:11px}
.le-hd .le-h1{margin-top:6px}

.le-org{margin-top:9px;display:flex;align-items:center;gap:12px;
  padding:6px 0 11px;border-bottom:1px solid var(--line)}
.le-org__m{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.le-orgline{display:flex;align-items:baseline;justify-content:space-between;gap:6px;
  white-space:nowrap}
.le-orgline dt{font:400 11.5px/1.3 var(--ui);color:var(--mute)}
.le-orgline dd{font:600 13px/1.3 var(--ui);color:var(--ink)}
.le-orgline dd em{font-style:normal;color:var(--mute);font-weight:400;font-size:11.5px}
.le-track{height:3px;border-radius:2px;background:rgba(53,81,63,.16);overflow:hidden}
.le-track i{display:block;height:100%;background:var(--moss);border-radius:2px}

.le-sess{margin-top:11px;padding:12px 15px 12px;border:1px solid var(--line);
  border-radius:18px 18px 20px 20px;background:rgba(255,255,255,.44)}
.le-sess__top{display:flex;justify-content:space-between;align-items:center}
.le-sess__top span{font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--mute)}
.le-sess .le-h2{margin-top:6px}
.le-plan{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.le-plan li{display:flex;gap:9px;align-items:center;font:400 12.2px/1.35 var(--ui);color:var(--mute)}
.le-plan li b{color:var(--ink);font-weight:600}
.le-plan .le-ic{width:15px;height:15px;flex:0 0 15px;color:var(--sage);stroke-width:1.7}
.le-go{margin-top:10px;width:100%;height:41px;border:0;border-radius:14px;background:var(--ink);
  color:var(--oat);display:flex;align-items:center;justify-content:center;gap:9px;
  font:600 14px/1 var(--ui);letter-spacing:.01em}
.le-go .le-ic{width:18px;height:18px}

.le-two{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.le-mini{padding:9px 11px 9px;border:1px solid var(--line);border-radius:16px}
.le-mini__h{display:flex;align-items:center;gap:6px;color:var(--mute);
  font:600 11px/1 var(--ui);letter-spacing:.05em;text-transform:uppercase}
.le-mini__h .le-ic{width:14px;height:14px;flex:0 0 14px}
.le-mini__v{margin-top:7px;font:400 18px/1 var(--slab);color:var(--ink)}
.le-mini__n{margin-top:6px;font:400 11px/1.3 var(--ui);color:var(--mute)}
.le-win{margin-top:8px;height:12px;position:relative}
.le-win svg{display:block;width:100%;height:12px}
.le-spark{margin-top:7px;display:block;width:100%;height:20px}

/* ---------- tab bar ---------- */
.le-tabs{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);
  padding:8px 8px 3px;border-top:1px solid var(--line);background:rgba(233,229,217,.6)}
.le-tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute)}
.le-tab span{font:500 11px/1 var(--ui);letter-spacing:.005em}
.le-tab .le-ic{width:21px;height:21px}
.le-tab--on{color:var(--ink)}
.le-tab--on span{font-weight:700}
.le-tab--on .le-ic{stroke-width:2.15}
.le-tab i{display:block;width:4px;height:4px;border-radius:50%;background:transparent}
.le-tab--on i{background:var(--ink)}

/* ---------- screen 2 : mid-set ---------- */
.le-set{flex:1 1 auto;display:flex;flex-direction:column;padding:0 22px}
.le-set__top{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.le-set__top .le-eyebrow{letter-spacing:.15em}
.le-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--mute)}
.le-x .le-ic{width:16px;height:16px}
.le-breathe{margin-top:26px;text-align:center}
.le-count{font:400 82px/.86 var(--slab);letter-spacing:-.045em;color:var(--ink);
  font-variant-numeric:tabular-nums}
.le-of{margin-top:9px;font:400 11.5px/1 var(--mono);letter-spacing:.12em;color:var(--mute);
  text-transform:uppercase;font-size:11px}
.le-move{margin-top:20px;text-align:center}
.le-move h2{font:400 24px/1.15 var(--slab);letter-spacing:-.01em}
.le-move p{margin-top:7px;font:400 12.5px/1.45 var(--ui);color:var(--mute)}
.le-arc{display:block;width:100%;height:56px;margin-top:18px;overflow:visible}
.le-arclab{margin-top:2px;display:flex;justify-content:space-between;
  font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--mute)}
.le-say{margin-top:18px;padding:13px 15px;border-radius:16px;
  background:rgba(53,81,63,.075);border:1px solid var(--line)}
.le-say p{font:400 13px/1.5 var(--slab);color:var(--ink)}
.le-next{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.le-nx{display:flex;align-items:center;gap:10px;font:400 12.2px/1.3 var(--ui);color:var(--mute)}
.le-nx .le-ic{width:15px;height:15px;flex:0 0 15px;color:var(--sage)}
.le-nx b{color:var(--ink);font-weight:600}
.le-nx small{margin-left:auto;font:600 11.5px/1 var(--mono);color:var(--mute)}
.le-ctrl{margin-top:auto;margin-bottom:8px;display:flex;gap:11px;align-items:center}
.le-btn{height:48px;border:1px solid var(--line);border-radius:15px;display:flex;
  align-items:center;justify-content:center;gap:8px;color:var(--ink);
  font:600 13.5px/1 var(--ui);background:rgba(255,255,255,.4)}
.le-btn--w{flex:1 1 auto}
.le-btn--s{width:64px;flex:0 0 64px;color:var(--mute)}
.le-btn .le-ic{width:17px;height:17px}

/* ---------- screen 3 : season ---------- */
.le-seas{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.le-seas__hd{padding:11px 22px 0}
.le-seas__hd .le-h1{margin-top:5px;font-size:22.5px}
.le-hero{margin-top:-2px;display:grid;place-items:center;position:relative}
.le-key{margin:-2px 22px 0;display:grid;grid-template-columns:repeat(3,1fr)}
.le-key li{display:flex;align-items:center;justify-content:center;gap:5px;
  font:400 11px/1.2 var(--ui);color:var(--mute);white-space:nowrap}
.le-key svg{flex:0 0 auto}
.le-states{margin:8px 22px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding-top:9px;border-top:1px solid var(--line)}
.le-state{display:flex;flex-direction:column;align-items:center;gap:4px}
.le-state span{font:600 11px/1 var(--ui);color:var(--ink);margin-top:1px}
.le-state small{font:400 11px/1 var(--ui);color:var(--mute)}
.le-week{margin:8px 22px 0;padding-top:8px;border-top:1px solid var(--line)}
.le-week__h{display:flex;justify-content:space-between;align-items:baseline}
.le-week__h b{font:600 12px/1 var(--ui)}
.le-week__h small{font:400 11px/1 var(--ui);color:var(--mute)}
.le-days{margin-top:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.le-day{display:flex;flex-direction:column;align-items:center;gap:5px}
.le-day em{font-style:normal;font:600 11px/1 var(--mono);color:var(--mute)}
.le-day u{text-decoration:none;display:block;width:100%;height:18px;border-radius:7px;
  background:rgba(53,81,63,.13);position:relative}
.le-day--on u{background:var(--moss)}
.le-day--now u{background:var(--saff)}
.le-day--rest u{background:transparent;border:1px dashed rgba(53,81,63,.40)}
.le-day--rest em{font-family:var(--ui);font-weight:500;letter-spacing:-.01em}
.le-note{margin:9px 22px 0;padding:10px 13px 11px;border-radius:16px;
  background:rgba(53,81,63,.075);border:1px solid var(--line)}
.le-note__h{display:flex;align-items:center;gap:7px;color:var(--mute);
  font:600 11px/1 var(--ui);letter-spacing:.07em;text-transform:uppercase}
.le-note__h .le-ic{width:14px;height:14px;flex:0 0 14px}
.le-note p{margin-top:6px;font:400 12px/1.42 var(--ui);color:var(--ink)}
.le-note p+p{margin-top:5px;color:var(--mute)}

/* ---------- screen 4 : lock ---------- */
.le-lock{flex:1 1 auto;display:flex;flex-direction:column;padding:0 20px;color:var(--oat)}
.le-lockdate{margin-top:54px;text-align:center;font:500 14px/1 var(--ui);
  color:rgba(233,229,217,.78);letter-spacing:.02em}
.le-lockclock{margin-top:6px;text-align:center;font:400 78px/1 var(--slab);
  letter-spacing:-.045em;color:var(--oat);font-variant-numeric:tabular-nums}
.le-la{margin-top:32px;padding:14px 15px 15px;border-radius:22px;
  background:rgba(233,229,217,.11);border:1px solid rgba(233,229,217,.20)}
.le-la__t{display:flex;align-items:center;gap:9px}
.le-la__t .le-form--lock{flex:0 0 34px}
.le-la__t b{font:600 12px/1 var(--ui);letter-spacing:.05em;text-transform:uppercase;
  color:rgba(233,229,217,.82)}
.le-la__t small{margin-left:auto;font:600 11.5px/1 var(--mono);color:rgba(233,229,217,.72)}
.le-la__v{margin-top:11px;display:flex;align-items:baseline;gap:9px}
.le-la__v strong{font:400 34px/1 var(--slab);font-weight:400;color:var(--oat);letter-spacing:-.02em}
.le-la__v span{font:400 12px/1.3 var(--ui);color:rgba(233,229,217,.72)}
.le-la__bar{margin-top:12px;height:5px;border-radius:3px;background:rgba(233,229,217,.18);
  overflow:hidden}
.le-la__bar i{display:block;height:100%;background:var(--sage);border-radius:3px}
.le-la__f{margin-top:9px;display:flex;justify-content:space-between;
  font:400 11px/1 var(--ui);color:rgba(233,229,217,.66)}
.le-la__f b{color:var(--oat);font-weight:600}
.le-mini2{margin-top:10px;padding:11px 15px;border-radius:18px;
  background:rgba(233,229,217,.075);border:1px solid rgba(233,229,217,.14);
  display:flex;align-items:center;gap:10px}
.le-mini2 .le-ic{width:17px;height:17px;color:var(--sage);flex:0 0 17px}
.le-mini2 p{font:400 12px/1.35 var(--ui);color:rgba(233,229,217,.82)}
.le-mini2 p b{color:var(--oat);font-weight:600}
.le-lockfoot{margin-top:auto;margin-bottom:12px;display:flex;justify-content:space-between;
  padding:0 26px}
.le-lockfoot span{width:44px;height:44px;border-radius:50%;background:rgba(233,229,217,.14);
  display:grid;place-items:center;color:var(--oat)}
.le-lockfoot .le-ic{width:20px;height:20px}

@media (prefers-reduced-motion:reduce){.le *{animation:none!important;transition:none!important}}
</style>
