.sysbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 24px 0;color:var(--sys-fg,#fff);font:600 13px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* ================= LANE D — "SIGNAL" / the kinetic poster ================= */
.ld{
  display:flex;gap:30px;
  --co:#1A38C8;   /* cobalt — field ink */
  --bo:#F0EDE4;   /* bone — paper */
  --bk:#0D0D0F;   /* black — ink */
  --cl:#FF5A3C;   /* coral — LIVE INTERVAL ONLY */
  --fc:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ff:Futura,"Gill Sans","Avenir Next","Helvetica Neue",sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,monospace;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.ld *{box-sizing:border-box;font-variant-numeric:tabular-nums}
.ld p,.ld h1,.ld h2,.ld figure{margin:0}
.ld svg{display:block}

/* --- shared poster atoms --- */
.ld-pane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ld-mono{font-family:var(--fm);font-size:11px;line-height:1.1;letter-spacing:.09em;text-transform:uppercase}
.ld-rule{height:1px;background:currentColor;opacity:.28;flex:0 0 auto}

/* --- meta strip (top of a poster) --- */
.ld-meta{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:11px 20px 9px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ld-meta__mark{display:flex;align-items:center;gap:7px}

/* --- tab bar: black slab, 4 destinations, active = knocked-out bone chip --- */
.ld-tabs{flex:0 0 auto;background:var(--bk);color:var(--bo);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px 5px;gap:3px}
.ld-tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 5px;border-radius:3px;opacity:.5}
.ld-tab span{font-family:var(--fm);font-size:11px;letter-spacing:.07em;text-transform:uppercase;line-height:1}

.ld-l__wc b{display:block;margin-top:5px;font-family:var(--fc);font-weight:700;font-size:28px;line-height:1;letter-spacing:-.03em}

/* live activity — coral, black ink */
