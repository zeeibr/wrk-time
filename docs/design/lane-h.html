<style>
/* ============ host-owned device shell (verbatim) ============ */
.shot{margin:0;flex:0 0 auto}
.dev{width:316px;height:666px;padding:8px;border-radius:46px;background:linear-gradient(160deg,#3a3d40,#17191a 40%,#2c2f31);box-shadow:0 2px 3px rgba(0,0,0,.4),0 30px 60px -30px rgba(0,0,0,.7);position:relative}
.dev__island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:86px;height:25px;border-radius:99px;background:#000;z-index:9}
.dev__screen{width:300px;height:650px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sysbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 24px 0;color:var(--sys-fg,#fff);font:600 13px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.homebar{flex:0 0 auto;height:24px;display:grid;place-items:center}
.homebar::after{content:"";width:112px;height:4px;border-radius:99px;background:var(--sys-fg,#fff);opacity:.4}

/* ==================== LANE H — "PLATE" ====================
   Swiss clinical document (C) as spine · cobalt + coral charge (D) · plain human voice (E) */
.lh{
  display:flex;gap:30px;
  --paper:#FBFBF9;
  --paper2:#F2F4F2;
  --rule:#DDE2E0;
  --ruleS:#E9ECEA;
  --ink:#0E1413;
  --ink2:#48524F;
  --ink3:#667370;
  --cobalt:#1A38C8;
  --coral:#FF5A3C;
  --green:#2E6F53;
  --sans:"Helvetica Neue",Helvetica,-apple-system,sans-serif;
  --cond:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.lh, .lh *{box-sizing:border-box}
.lh :where(p,h1,h2,h3,ul,li,figure,figcaption){margin:0;padding:0;list-style:none}
.lh :where(svg){display:block}
.lh :where(em,i){font-style:normal}

/* ---------- shared atoms ---------- */
.lh .lh-ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lh .lh-ic--t{stroke-width:2}
.lh .lh-num{font-variant-numeric:tabular-nums}

.lh .lhS{--sys-fg:#0E1413;background:var(--paper);color:var(--ink)}
.lh .lh-pg{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:11px 14px 0}

/* masthead */
.lh .lh-mast{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto}
.lh .lh-mast__b{display:flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--ink)}
.lh .lh-mast__d{font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh .lh-h1{margin-top:9px;font:300 26px/1.04 var(--sans);letter-spacing:-.034em;color:var(--ink)}
.lh .lh-h1 em{font-weight:500}
.lh .lh-sub{margin-top:6px;font:400 11.5px/1.42 var(--sans);color:var(--ink2)}
.lh .lh-ruleF{height:1.5px;background:var(--ink);margin-top:10px;flex:0 0 auto}
.lh .lh-ruleH{height:1px;background:var(--rule);flex:0 0 auto}

/* marginal index rail */
.lh .lh-sec{display:grid;grid-template-columns:18px 1fr;column-gap:12px;flex:0 0 auto}
.lh .lh-sec + .lh-sec{margin-top:12px}
.lh .lh-sec__idx{display:flex;flex-direction:column;align-items:flex-start;padding-top:2px;padding-right:5px;border-right:1px solid var(--rule);margin-right:-6px}
.lh .lh-idx__n{font:500 11px/1 var(--mono);letter-spacing:.02em;color:var(--ink)}
.lh .lh-idx__v{margin-top:9px;writing-mode:vertical-rl;transform:rotate(180deg);font:400 11px/1 var(--mono);letter-spacing:.16em;color:var(--ink3)}
.lh .lh-sec__body{min-width:0}
.lh .lh-sh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:5px;gap:8px}
.lh .lh-sh__t{font:500 13px/1 var(--sans);letter-spacing:-.008em;color:var(--ink)}
.lh .lh-sh__m{font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.lh .lh-sh + .lh-ruleF{margin-top:0;height:1.2px}

/* tab bar */
.lh .lh-tabs{margin-top:auto;flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);background:var(--paper)}
.lh .lh-tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;color:var(--ink3);border-top:2px solid transparent;margin-top:-1px}
.lh .lh-tab svg{width:21px;height:21px}
.lh .lh-tab span{font:400 11px/1 var(--mono);letter-spacing:.06em}
.lh .lh-tab.is-on{color:var(--ink);border-top-color:var(--ink)}
.lh .lh-tab.is-on span{font-weight:500}

/* ==================== 1 — TODAY ==================== */
.lh .lh-ses__ttl{margin-top:9px;font:500 19px/1.08 var(--sans);letter-spacing:-.026em;color:var(--ink)}
.lh .lh-ses__meta{margin-top:6px;display:flex;gap:9px;font:400 11px/1 var(--mono);letter-spacing:.07em;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh .lh-ses__meta i{color:var(--rule)}
.lh .lh-blk{margin-top:9px}
.lh .lh-blk__r{display:grid;grid-template-columns:17px 20px 1fr auto;column-gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.lh .lh-blk__r:first-child{border-top:1.2px solid var(--ink)}
.lh .lh-blk__i{font:400 11px/1 var(--mono);color:var(--ink3)}
.lh .lh-blk__g{width:20px;height:20px;color:var(--ink2)}
.lh .lh-blk__n{font:400 12.5px/1.2 var(--sans);letter-spacing:-.004em;color:var(--ink)}
.lh .lh-blk__v{font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lh .lh-blk__r:last-child{border-bottom:1px solid var(--rule)}

.lh .lh-go{margin-top:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cobalt);color:var(--paper);padding:11px 12px 11px 14px}
.lh .lh-go__l{display:flex;align-items:center;gap:9px}
.lh .lh-go__t{font:700 19px/1 var(--cond);letter-spacing:.008em;text-transform:uppercase}
.lh .lh-go__r{font:400 11px/1 var(--mono);letter-spacing:.09em;opacity:.82;white-space:nowrap;font-variant-numeric:tabular-nums}

.lh .lh-two{display:grid;grid-template-columns:1fr 1fr;column-gap:13px;padding-top:9px}
.lh .lh-two>div+div{border-left:1px solid var(--rule);padding-left:13px;margin-left:-1px}
.lh .lh-mk{font:400 11px/1 var(--mono);letter-spacing:.13em;color:var(--ink3)}
.lh .lh-mv{margin-top:7px;font:300 24px/1 var(--sans);letter-spacing:-.038em;color:var(--ink);font-variant-numeric:tabular-nums}
.lh .lh-mv u{text-decoration:none;font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);margin-left:5px}
.lh .lh-mc{margin-top:7px;font:400 11px/1 var(--mono);letter-spacing:.03em;color:var(--ink3)}
.lh .lh-bar{position:relative;height:6px;margin-top:9px;background:var(--ruleS);border-bottom:1px solid var(--rule)}
.lh .lh-bar i{position:absolute;left:0;top:0;bottom:0;width:75.6%;background:var(--ink)}
.lh .lh-bar u{position:absolute;right:0;top:-3px;bottom:-3px;width:1.5px;background:var(--ink);text-decoration:none}
.lh .lh-segs{display:flex;gap:2px;margin-top:9px;height:6px}
.lh .lh-segs span{flex:1 1 auto;background:var(--ruleS);border-bottom:1px solid var(--rule)}
.lh .lh-segs span.is-on{background:var(--ink);border-bottom-color:var(--ink)}
.lh .lh-segs span.is-now{background:var(--paper);border:1px solid var(--cobalt);border-bottom-color:var(--cobalt)}

.lh .lh-trTop{display:flex;justify-content:space-between;align-items:baseline;padding-top:3px}
.lh .lh-trTop__v{font:300 22px/1 var(--sans);letter-spacing:-.036em;font-variant-numeric:tabular-nums}
.lh .lh-trTop__v u{text-decoration:none;font:400 11px/1 var(--mono);letter-spacing:.11em;color:var(--ink3);margin-left:4px}
.lh .lh-trTop__d{display:flex;align-items:center;gap:4px;font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--green);font-variant-numeric:tabular-nums}
.lh .lh-trTop__d svg{width:13px;height:13px}
.lh .lh-spark{display:block;width:100%;height:auto;margin-top:6px}
.lh .lh-spAx{display:flex;justify-content:space-between;margin-top:5px;font:400 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink3)}

/* the single fasting line — nothing more */
.lh .lh-fast{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0 10px;border-top:1px solid var(--rule);flex:0 0 auto}
.lh .lh-fast__l{display:flex;align-items:center;gap:7px;font:400 11.5px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.lh .lh-fast__l svg{width:15px;height:15px;flex:0 0 15px;color:var(--ink3)}
.lh .lh-fast__r{font:400 11px/1 var(--mono);letter-spacing:.07em;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ==================== 2 — MID-SET (the poster) ==================== */
.lh .lhS--2{background:var(--ink);--sys-fg:#FBFBF9}
.lh .lh-hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:var(--ink)}
.lh .lh-hero__drain{position:absolute;left:0;right:0;bottom:0;height:68.33%;background:var(--coral);overflow:hidden}
.lh .lh-hero__f{position:absolute;left:0;width:300px;padding:12px 18px 13px 34px;display:flex;flex-direction:column}
.lh .lh-hero__f--dark{top:0;bottom:0;color:var(--paper)}
.lh .lh-hero__f--dark .lh-hero__n{color:var(--coral)}
.lh .lh-hero__f--lit{bottom:0;height:146.35%;color:var(--ink)}
.lh .lh-hero__side{position:absolute;left:9px;top:16px;bottom:16px;width:16px;display:flex;align-items:flex-start;justify-content:center}
.lh .lh-hero__side span{writing-mode:vertical-rl;transform:rotate(180deg);font:400 11px/1 var(--mono);letter-spacing:.19em;white-space:nowrap;opacity:.85}
.lh .lh-hero__top{display:flex;justify-content:space-between;align-items:center;font:500 11px/1 var(--mono);letter-spacing:.16em;font-variant-numeric:tabular-nums}
.lh .lh-hero__top b{font-weight:500;display:flex;align-items:center;gap:6px}
.lh .lh-hero__top span{font-weight:400;opacity:.85}
.lh .lh-hero__pips{margin-top:13px}
.lh .lh-hero__n{font:700 128px/.8 var(--cond);letter-spacing:-.05em;margin:82px 0 0 -5px;font-variant-numeric:tabular-nums}
.lh .lh-hero__u{margin-top:12px;font:400 11px/1 var(--mono);letter-spacing:.19em;opacity:.85}
.lh .lh-hero__foot{margin-top:auto}
.lh .lh-hero__ex{font:700 42px/.86 var(--cond);letter-spacing:-.025em;text-transform:uppercase;margin-left:-2px}
.lh .lh-hero__cue{margin-top:10px;font:400 12px/1.42 var(--sans);letter-spacing:-.002em;max-width:230px}
.lh .lh-hero__nx{margin-top:10px;padding-top:9px;border-top:1.5px solid currentColor;font:400 11px/1.5 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.lh .lh-hero__ctl{display:flex;gap:8px;margin-top:13px}
.lh .lh-hero__btn{width:54px;height:38px;display:grid;place-items:center;border:1.5px solid currentColor}
.lh .lh-hero__btn--w{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}

/* ==================== 3 — BUILD A ROUTINE ==================== */
.lh .lh-fld{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:9px 0 8px;border-bottom:1.2px solid var(--ink)}
.lh .lh-fld__v{font:400 17px/1.1 var(--sans);letter-spacing:-.02em;color:var(--ink);display:flex;align-items:center;gap:2px}
.lh .lh-caret{display:inline-block;width:1.5px;height:17px;background:var(--cobalt);margin-left:2px}
.lh .lh-fld__k{font:400 11px/1 var(--mono);letter-spacing:.1em;color:var(--ink3);white-space:nowrap;padding-bottom:2px}

.lh .lh-three{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:12px;border-top:1.2px solid var(--ink);border-bottom:1px solid var(--rule)}
.lh .lh-three>div{padding:8px 8px 9px 10px;border-left:1px solid var(--rule)}
.lh .lh-three>div:first-child{border-left:0;padding-left:0}
.lh .lh-stk{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin-top:6px}
.lh .lh-stk__v{font:300 23px/1 var(--sans);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.lh .lh-stk__v u{text-decoration:none;font:400 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink3);margin-left:2px}
.lh .lh-stk__b{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.lh .lh-stk__b i{width:20px;height:14px;display:grid;place-items:center;border:1px solid var(--rule);color:var(--ink2)}
.lh .lh-stk__b i svg{width:14px;height:14px}
.lh .lh-cap{margin-top:6px;font:400 11px/1 var(--mono);letter-spacing:.05em;color:var(--ink3)}
.lh .lh-cap.is-hit{color:var(--cobalt)}

.lh .lh-mvs{margin-top:2px}
.lh .lh-mv__r{display:grid;grid-template-columns:16px 18px 1fr auto;column-gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.lh .lh-mv__i{font:400 11px/1 var(--mono);color:var(--ink3)}
.lh .lh-mv__g{width:18px;height:18px;color:var(--ink3)}
.lh .lh-mv__n{font:400 12.5px/1.2 var(--sans);color:var(--ink)}
.lh .lh-mv__e{font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.lh .lh-mv__add{display:grid;grid-template-columns:16px 18px 1fr auto;column-gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--rule)}
.lh .lh-mv__add .lh-mv__n{color:var(--cobalt);font-weight:500}
.lh .lh-mv__add .lh-mv__g{color:var(--cobalt)}
.lh .lh-hint{margin-top:8px;font:400 11.5px/1.42 var(--sans);color:var(--ink2)}

.lh .lh-tot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:8px 0 9px;border-bottom:1px solid var(--rule)}
.lh .lh-tot__v{font:300 30px/1 var(--sans);letter-spacing:-.042em;color:var(--ink);font-variant-numeric:tabular-nums}
.lh .lh-tot__r{text-align:right;font:400 11px/1.5 var(--mono);letter-spacing:.05em;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh .lh-save{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cobalt);color:var(--paper);padding:11px 12px 11px 14px}
.lh .lh-save__t{font:700 19px/1 var(--cond);letter-spacing:.008em;text-transform:uppercase}
.lh .lh-save__r{font:400 11px/1 var(--mono);letter-spacing:.09em;opacity:.82}

.lh .lh-sv{display:grid;grid-template-columns:1fr auto 22px;column-gap:9px;align-items:center;padding:8px 0 9px;border-top:1.2px solid var(--ink);border-bottom:1px solid var(--rule)}
.lh .lh-sv__n{font:400 12.5px/1.2 var(--sans);color:var(--ink)}
.lh .lh-sv__m{display:block;margin-top:4px;font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh .lh-sv__v{font:400 13px/1 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.lh .lh-sv__p{width:22px;height:22px;color:var(--cobalt)}

/* ==================== 4 — PROGRESS (hero plate) ==================== */
.lh .lh-figK{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px}
.lh .lh-figK__l{font:500 11px/1 var(--mono);letter-spacing:.14em;color:var(--ink)}
.lh .lh-figK__r{font:400 11px/1 var(--mono);letter-spacing:.09em;color:var(--ink3)}
.lh .lh-plate{display:block;width:242px;height:164px;margin-top:5px}
.lh .lh-pl-grid line{stroke:var(--rule);stroke-width:1}
.lh .lh-pl-ax{stroke:var(--ink);stroke-width:1.2}
.lh .lh-pl-axY{stroke:var(--rule);stroke-width:1}
.lh .lh-pl-tick line{stroke:var(--ink3);stroke-width:1}
.lh .lh-pl-lab text{font:400 11px var(--mono);letter-spacing:.04em;fill:var(--ink3)}
.lh .lh-pl-labG{font:500 11px var(--mono);letter-spacing:.04em;fill:var(--green)}
.lh .lh-pl-axT{font:400 11px var(--mono);letter-spacing:.06em;fill:var(--ink3)}
.lh .lh-pl-band{fill:rgba(26,56,200,.085)}
.lh .lh-pl-area{fill:rgba(14,20,19,.07)}
.lh .lh-pl-proj{fill:none;stroke:var(--cobalt);stroke-width:1.4;stroke-dasharray:4 3.2;stroke-linecap:round}
.lh .lh-pl-act{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.lh .lh-pl-goal{stroke:var(--green);stroke-width:1.2;stroke-dasharray:1 3;stroke-linecap:round}
.lh .lh-pl-now{stroke:var(--ink3);stroke-width:1;stroke-dasharray:1 3}
.lh .lh-pl-halo{fill:var(--paper)}
.lh .lh-pl-dot{fill:var(--ink)}
.lh .lh-pl-end{fill:var(--green)}
.lh .lh-pl-lead{stroke:var(--ink);stroke-width:.9}
.lh .lh-pl-annV{font:300 19px var(--sans);letter-spacing:-.035em;fill:var(--ink)}
.lh .lh-pl-annK{font:400 11px var(--mono);letter-spacing:.06em;fill:var(--ink3)}
.lh .lh-pl-projL{font:400 11px var(--mono);letter-spacing:.08em;fill:var(--cobalt)}
.lh .lh-plNote{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--rule);font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink3);font-variant-numeric:tabular-nums}
.lh .lh-modelIn{display:flex;align-items:center;gap:7px;margin-top:8px;font:400 11.5px/1.35 var(--sans);color:var(--ink2)}
.lh .lh-modelIn em{flex:0 0 auto;font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--cobalt);border:1px solid var(--cobalt);padding:3px 4px 2px}

.lh .lh-tbl{margin-top:1px}
.lh .lh-tr{display:grid;grid-template-columns:14px 1fr 46px 36px 66px;column-gap:6px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule)}
.lh .lh-tr--h{padding:0 0 6px;border-bottom:1.5px solid var(--ink)}
.lh .lh-tr--h span{font:500 11px/1 var(--mono);letter-spacing:.11em;color:var(--ink3)}
.lh .lh-tr--h .lh-c3,.lh .lh-tr--h .lh-c5{text-align:right}
.lh .lh-c1{font:400 11px/1 var(--mono);color:var(--ink3)}
.lh .lh-c2{font:400 12px/1 var(--sans);color:var(--ink)}
.lh .lh-c3{font:400 13px/1 var(--sans);letter-spacing:-.012em;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.lh .lh-c4{font:400 11px/1 var(--mono);letter-spacing:.03em;color:var(--ink3)}
.lh .lh-c5{font:500 11px/1 var(--mono);letter-spacing:.04em;color:var(--ink2);text-align:right}
.lh .lh-c5.is-ok{color:var(--green)}
.lh .lh-note{margin-top:9px;display:grid;grid-template-columns:15px 1fr;column-gap:8px}
.lh .lh-note svg{width:15px;height:15px;color:var(--ink3);margin-top:1px}
.lh .lh-note p{font:400 11.5px/1.42 var(--sans);color:var(--ink2)}
.lh .lh-note b{font-weight:500;color:var(--ink)}

/* ==================== 5 — LOCK SCREEN ==================== */
.lh .lhS--5{--sys-fg:#F4F6F4;background:linear-gradient(176deg,#0A0F0E 0%,#141C1A 54%,#0B100F 100%);color:#F4F6F4}
.lh .lh-lk{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.lh .lh-lk__date{text-align:center;margin-top:50px;font:400 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.78}
