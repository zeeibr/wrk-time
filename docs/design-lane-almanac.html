<style>
/* ============ host-owned device shell (verbatim) ============ */
.shot{margin:0;flex:0 0 auto}
.dev{width:316px;height:666px;padding:8px;border-radius:46px;background:linear-gradient(160deg,#3a3d40,#17191a 40%,#2c2f31);box-shadow:0 2px 3px rgba(0,0,0,.4),0 30px 60px -30px rgba(0,0,0,.7);position:relative}
.dev__island{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:86px;height:25px;border-radius:99px;background:#000;z-index:9}
.dev__screen{width:300px;height:650px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sysbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:15px 24px 0;color:var(--sys-fg,#fff);font:600 13px/1 -apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.homebar{flex:0 0 auto;height:24px;display:grid;place-items:center}
.homebar::after{content:"";width:112px;height:4px;border-radius:99px;background:var(--sys-fg,#fff);opacity:.4}

/* ================= LANE G — "ALMANAC" ================= */
.lg{display:flex;gap:30px}
.lg{
  --ink:#0F1A15; --moss:#35513F; --sage:#8FA894; --oat:#E9E5D9; --saff:#D9A227;
  --mute:#4A6252; --line:rgba(53,81,63,.22); --line2:rgba(53,81,63,.40);
  --slab:Superclarendon,"American Typewriter",Charter,"Iowan Old Style",serif;
  --ui:-apple-system,"Avenir Next","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;
}
.lg :where(figure,h1,h2,h3,p,ul,ol,li,dl,dt,dd,table,button,nav,a,figcaption){
  margin:0;padding:0;list-style:none;border:0;background:none;color:inherit;
  font:inherit;text-decoration:none;text-align:left}
.lg :where(b,strong){font-weight:600}
.lg :where(svg){display:block}
.lg :where([class^="lg-"],[class*=" lg-"]){box-sizing:border-box;font-variant-numeric:tabular-nums}

/* screen grounds */
.lg .lgS--1,.lg .lgS--3,.lg .lgS--4{--sys-fg:#0F1A15;background:
  radial-gradient(120% 68% at 18% 0%,rgba(255,255,255,.55),transparent 60%),
  linear-gradient(178deg,#EFECE1 0%,#E9E5D9 46%,#E2DECF 100%)}
.lg .lgS--2{--sys-fg:#0F1A15;background:linear-gradient(178deg,#EFECE1 0%,#E9E5D9 100%)}
.lg .lgS--5{--sys-fg:#E9E5D9;background:
  radial-gradient(120% 58% at 26% 6%,#22362B 0%,transparent 62%),
  linear-gradient(172deg,#16241C 0%,#0F1A15 55%,#0B120E 100%)}

.lg-pane{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lg-pad{padding:0 21px}
.lg-pane>:where(div,nav,p,h1,ul,dl,svg){flex:0 0 auto}

/* --- shared atoms: C's bones -------------------------------------- */
.lg-mono{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lg-rule{height:1px;background:var(--line);flex:0 0 auto}
.lg-rule--firm{height:1.4px;background:var(--ink)}
.lg-h1{font:400 28px/1.06 var(--slab);letter-spacing:-.016em;color:var(--ink)}
.lg-h2{font:400 20px/1.16 var(--slab);letter-spacing:-.01em;color:var(--ink)}
.lg-p{font:400 12.4px/1.44 var(--ui);color:var(--mute)}
.lg-ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.lg-mast{display:flex;justify-content:space-between;align-items:baseline;padding-top:11px}
.lg-mast b{font:600 11px/1 var(--mono);letter-spacing:.28em;color:var(--ink)}
.lg-mast span{font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--mute)}

/* --- tab bar ------------------------------------------------------- */
.lg-tabs{margin-top:auto;flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  padding:7px 6px 3px;border-top:1px solid var(--line2);background:rgba(233,229,217,.55)}
.lg-tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute)}
.lg-tab span{font:500 11px/1 var(--ui);letter-spacing:.01em}
.lg-tab .lg-ic{width:21px;height:21px}
.lg-tab--on{color:var(--ink)}
.lg-tab--on span{font-weight:700}
.lg-tab--on .lg-ic{stroke-width:2}
.lg-tab i{display:block;width:4px;height:4px;border-radius:50%;background:transparent}
.lg-tab--on i{background:var(--ink)}

/* --- growth form --------------------------------------------------- */
.lg-form{display:block;overflow:visible}
.lg-form--hero{width:130px;height:130px}
.lg-form--thumb{width:80px;height:80px;flex:0 0 80px;margin-left:-5px}

/* ============ 1 · TODAY ============ */
.lg-eyebrow{margin-top:9px;font:600 11px/1 var(--mono);letter-spacing:.15em;
  text-transform:uppercase;color:var(--mute)}
.lg-t__h{margin-top:7px}
.lg-t__spec{display:grid;grid-template-columns:repeat(3,1fr);margin-top:11px;
  border-top:1.4px solid var(--ink);border-bottom:1px solid var(--line2)}
.lg-t__spec>div{padding:6px 0 7px 9px;border-left:1px solid var(--line)}
.lg-t__spec>div:first-child{border-left:0;padding-left:0}
.lg-t__spec b{display:block;font:400 21px/1 var(--slab);letter-spacing:-.02em;color:var(--ink)}
.lg-t__spec i{display:block;margin-top:5px;font:400 11px/1 var(--mono);letter-spacing:.1em;
  font-style:normal;text-transform:uppercase;color:var(--mute)}
.lg-blk{display:flex;align-items:center;gap:10px;padding:6px 0 7px;border-bottom:1px solid var(--line)}
.lg-blk em{flex:0 0 15px;font-style:normal;font:400 11px/1 var(--mono);color:var(--sage);letter-spacing:.04em}
.lg-blk>.lg-ic{flex:0 0 19px;width:19px;height:19px;color:var(--moss)}
.lg-blk div{flex:1 1 auto;min-width:0}
.lg-blk b{display:block;font:600 13px/1.2 var(--ui);letter-spacing:-.005em;color:var(--ink)}
.lg-blk small{display:block;margin-top:3px;white-space:nowrap;font:400 11px/1 var(--mono);letter-spacing:.05em;color:var(--mute)}
.lg-blk span{flex:0 0 auto;font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--mute)}
.lg-go{margin-top:11px;width:100%;height:43px;border-radius:15px;background:var(--ink);
  color:var(--oat);display:flex;align-items:center;justify-content:center;gap:9px;
  font:600 14.5px/1 var(--ui);letter-spacing:.005em}
.lg-go .lg-ic{width:19px;height:19px;stroke-width:1.8}

.lg-org{margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);
  display:flex;align-items:center;gap:12px}
.lg-org dl{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg-orgline{display:flex;align-items:baseline;justify-content:space-between;gap:6px;white-space:nowrap;
  border-bottom:1px dotted var(--line2);padding-bottom:5px}
.lg-orgline:last-child{border-bottom:0;padding-bottom:0}
.lg-orgline dt{font:400 11.5px/1.2 var(--ui);color:var(--mute)}
.lg-orgline dd{font:600 12.5px/1.2 var(--ui);color:var(--ink)}
.lg-orgline dd em{font-style:normal;font-weight:400;color:var(--mute);font-size:11px}

.lg-two{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-top:1.4px solid var(--ink)}
.lg-two>div{padding:8px 0 2px}
.lg-two>div+div{border-left:1px solid var(--line2);padding-left:12px}
.lg-two__k{display:flex;align-items:center;gap:5px;color:var(--mute);
  font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.lg-two__k .lg-ic{width:13px;height:13px;flex:0 0 13px}
.lg-two__v{margin-top:6px;font:400 18px/1 var(--slab);letter-spacing:-.015em;color:var(--ink)}
.lg-two__v u{text-decoration:none;font:400 11px/1 var(--mono);letter-spacing:.08em;color:var(--mute);margin-left:4px}
.lg-two__n{margin-top:5px;font:400 11px/1.3 var(--ui);color:var(--mute)}
.lg-win{margin-top:7px;display:block;width:100%;height:11px}
.lg-spark{margin-top:6px;display:block;width:100%;height:19px}

/* ============ 2 · MID-SET — D's draining field, warm ============ */
.lg-field{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  background:linear-gradient(178deg,#EFECE1 0%,#E9E5D9 62%,#E2DECF 100%)}
.lg-field__drain{position:absolute;left:0;right:0;bottom:0;height:68.33%;
  background:var(--ink);overflow:hidden}
.lg-f{position:absolute;left:0;width:300px;padding:13px 20px 12px 33px;display:flex;flex-direction:column}
.lg-f--base{top:0;bottom:0;color:var(--ink)}
.lg-f--knock{bottom:0;height:146.35%;color:var(--oat)}
.lg-f__side{position:absolute;left:7px;top:16px;bottom:16px;width:16px;display:flex;
  align-items:flex-start;justify-content:center}
.lg-f__side span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
  font:600 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;opacity:.62}
.lg-f__top{display:flex;justify-content:space-between;align-items:center;
  font:600 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.lg-f__top b{display:flex;align-items:center;gap:6px;font-weight:600}
.lg-f__pips{margin-top:12px;width:100%;height:8px}
.lg-f__n{margin-top:92px;font:400 96px/.84 var(--slab);letter-spacing:-.035em;margin-left:-4px}
.lg-f__u{margin-top:13px;display:flex;align-items:center;gap:9px;
  font:600 11px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase}
.lg-f__live{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--saff);color:var(--ink);
  border-radius:99px;padding:5px 9px 5px 7px;font:600 11px/1 var(--mono);letter-spacing:.15em}
.lg-f__live .lg-ic{width:12px;height:12px;stroke-width:2;flex:0 0 12px}
.lg-f__foot{margin-top:auto}
.lg-f__ex{font:400 33px/1.02 var(--slab);letter-spacing:-.018em;margin-left:-2px}
.lg-f__nx{margin-top:11px;padding-top:9px;border-top:1.6px solid currentColor;
  font:500 11px/1.55 var(--mono);letter-spacing:.07em;text-transform:uppercase;opacity:.92}
.lg-f__ctl{display:flex;gap:9px;margin-top:12px}
.lg-f__btn{width:54px;height:40px;display:grid;place-items:center;
  border:1.6px solid currentColor;border-radius:12px}
.lg-f__btn .lg-ic{width:20px;height:20px;stroke-width:1.9}
.lg-f__btn--w{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;
  font:600 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.lg-f__btn--w .lg-ic{width:16px;height:16px}

/* ============ 3 · BUILD A ROUTINE ============ */
.lg-name{margin-top:7px;display:flex;align-items:baseline;gap:7px;
  padding-bottom:7px;border-bottom:1.4px solid var(--ink)}
.lg-name h1{font:400 26px/1.1 var(--slab);letter-spacing:-.016em}
.lg-name i{display:block;width:1.6px;height:22px;background:var(--saff);flex:0 0 1.6px}
.lg-name .lg-ic{width:16px;height:16px;color:var(--mute);margin-left:auto;flex:0 0 16px;
  align-self:center}
.lg-sum{margin-top:7px;font:500 11px/1.4 var(--mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute)}
.lg-sum b{color:var(--ink);font-weight:600}

.lg-dials{margin-top:9px;display:grid;grid-template-columns:1fr 1fr;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.lg-dial{padding:9px 0 10px}
.lg-dial+.lg-dial{border-left:1px solid var(--line2);padding-left:13px}
.lg-dial__k{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lg-dial__r{margin-top:6px;display:flex;align-items:center;gap:8px}
.lg-dial__r b{font:400 24px/1 var(--slab);letter-spacing:-.02em;color:var(--ink)}
.lg-dial__r b u{text-decoration:none;font:400 11px/1 var(--mono);letter-spacing:.08em;
  color:var(--mute);margin-left:3px}
.lg-step{width:25px;height:25px;border-radius:50%;border:1px solid var(--line2);
  display:grid;place-items:center;color:var(--moss);flex:0 0 25px}
.lg-step .lg-ic{width:13px;height:13px;stroke-width:1.9}
.lg-step--last{margin-left:auto}
.lg-scale{position:relative;margin-top:9px;height:11px;padding-right:11px}
.lg-scale svg{display:block;width:100%;height:11px}
.lg-scale em{position:absolute;right:0;top:-1px;font-style:normal;
  font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--saff)}

.lg-sec{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-bottom:4px;border-bottom:1.4px solid var(--ink)}
.lg-sec b{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.lg-sec span{font:400 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lg-mv{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.lg-mv__g{flex:0 0 13px;width:13px;height:16px;color:var(--sage)}
.lg-mv>.lg-ic{flex:0 0 18px;width:18px;height:18px;color:var(--moss)}
.lg-mv div{flex:1 1 auto;min-width:0}
.lg-mv b{display:block;font:400 14px/1.15 var(--slab);letter-spacing:-.01em;color:var(--ink)}
.lg-mv small{display:block;margin-top:3px;font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--mute)}
.lg-mv span{flex:0 0 auto;font:600 11px/1 var(--mono);letter-spacing:.05em;color:var(--mute)}
.lg-mv--lift{background:rgba(255,255,255,.62);border-radius:12px;padding:8px 8px;margin:0 -8px;
  box-shadow:0 1px 1px rgba(15,26,21,.06),0 10px 18px -10px rgba(15,26,21,.45);
  border-bottom-color:transparent}
.lg-add{display:flex;align-items:center;gap:9px;padding:10px 0 0;color:var(--moss)}
.lg-add .lg-ic{width:18px;height:18px;flex:0 0 18px}
.lg-add b{font:600 12.5px/1 var(--ui)}
.lg-chips{display:flex;gap:6px;margin-top:9px}
.lg-chip{flex:0 0 auto;padding:6px 10px;border:1px solid var(--line2);border-radius:99px;
  font:500 11px/1 var(--ui);color:var(--mute);white-space:nowrap}
.lg-chip--cut{opacity:.45}

.lg-total{margin-top:12px;padding-top:9px;border-top:1.4px solid var(--ink);
  display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.lg-total b{font:400 40px/.9 var(--slab);letter-spacing:-.03em;color:var(--ink)}
.lg-total span{font:500 11px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--mute);text-align:right;padding-bottom:3px}
.lg-saved{margin-top:10px;display:flex;align-items:center;gap:10px;padding:9px 11px;
  border:1px solid var(--line2);border-radius:15px;background:rgba(255,255,255,.45)}
.lg-saved div{flex:1 1 auto;min-width:0}
.lg-saved b{display:block;font:400 14px/1.15 var(--slab);color:var(--ink)}
.lg-saved small{display:block;margin-top:3px;font:400 11px/1 var(--mono);letter-spacing:.04em;color:var(--mute)}
.lg-saved u{text-decoration:none;flex:0 0 32px;width:32px;height:32px;border-radius:50%;
  background:var(--ink);color:var(--oat);display:grid;place-items:center}
.lg-saved u .lg-ic{width:15px;height:15px;fill:currentColor;stroke-width:1.4}

/* ============ 4 · PROGRESS ============ */
.lg-hero{margin-top:6px;display:grid;place-items:center}
.lg-key{margin-top:2px;display:flex;justify-content:center;gap:13px}
.lg-key li{display:flex;align-items:center;gap:5px;font:400 11px/1.2 var(--ui);
  color:var(--mute);white-space:nowrap}
.lg-3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;
  border-top:1.4px solid var(--ink);border-bottom:1px solid var(--line2)}
.lg-3>div{padding:7px 0 8px 10px;border-left:1px solid var(--line)}
.lg-3>div:first-child{border-left:0;padding-left:0}
.lg-3 b{display:block;font:400 20px/1 var(--slab);letter-spacing:-.02em;color:var(--ink)}
.lg-3 b u{text-decoration:none;font:400 11px/1 var(--mono);color:var(--mute);margin-left:3px;letter-spacing:.06em}
.lg-3 i{display:block;margin-top:5px;font-style:normal;font:400 11px/1 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lg-figk{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px}
.lg-figk b{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.lg-figk span{font:400 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.lg-chart{display:block;width:256px;height:146px;margin-top:3px}
.lg-c__grid line{stroke:var(--line);stroke-width:1}
.lg-c__ylab text{font:400 11px var(--mono);letter-spacing:.04em;fill:var(--mute)}
.lg-c__band{fill:rgba(53,81,63,.13)}
.lg-c__goal{stroke:var(--saff);stroke-width:1.2;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.lg-c__area{fill:rgba(53,81,63,.12)}
.lg-c__act{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.lg-c__proj{fill:none;stroke:var(--moss);stroke-width:1.3;stroke-dasharray:4 3.4;stroke-linecap:round}
.lg-c__now{stroke:var(--sage);stroke-width:1;stroke-dasharray:1.5 3}
.lg-c__halo{fill:#EDEADF}
.lg-c__plate{fill:#EDEADF;opacity:.88}
.lg-c__dot{fill:var(--ink)}
.lg-c__lead{stroke:var(--ink);stroke-width:.9}
.lg-c__annv{font:400 15px var(--slab);letter-spacing:-.02em;fill:var(--ink)}
.lg-c__annk{font:400 11px var(--mono);letter-spacing:.08em;fill:var(--mute)}
.lg-c__end{fill:var(--saff)}
.lg-c__tgt{font:600 11px var(--mono);letter-spacing:.06em;fill:#9A7112}
.lg-c__band-l{font:400 11px var(--mono);letter-spacing:.06em;fill:var(--mute)}
.lg-c__axis{stroke:var(--ink);stroke-width:1.2}
.lg-c__tick line{stroke:var(--mute);stroke-width:1}
.lg-c__ax{font:400 11px var(--mono);letter-spacing:.1em;fill:var(--mute)}
.lg-fast{margin-top:9px;display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.lg-fast>div{padding:7px 0 8px 10px;border-left:1px solid var(--line)}
.lg-fast>div:first-child{border-left:0;padding-left:0}
.lg-fast b{display:block;font:400 16px/1 var(--slab);color:var(--ink)}
.lg-fast i{display:block;margin-top:5px;font-style:normal;font:400 11px/1 var(--mono);
  letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.lg-note{margin-top:9px;display:flex;gap:8px}
.lg-note .lg-ic{flex:0 0 15px;width:15px;height:15px;color:var(--moss);margin-top:1px}
.lg-note p{font:400 11.6px/1.42 var(--ui);color:var(--mute)}
.lg-note p b{color:var(--ink);font-weight:600}

/* ============ 5 · LOCK SCREEN ============ */
.lg-lock{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0 18px;color:var(--oat)}
.lg-lock__d{margin-top:48px;text-align:center;font:500 13px/1 var(--ui);letter-spacing:.06em;
  text-transform:uppercase;color:rgba(233,229,217,.76)}
.lg-lock__c{margin-top:6px;text-align:center;font:400 84px/1 var(--slab);letter-spacing:-.04em;color:var(--oat)}
.lg-lock__w{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.lg-lw{border:1px solid rgba(233,229,217,.24);border-radius:15px;padding:8px 11px 10px;
  background:rgba(233,229,217,.06)}
.lg-lw em{display:flex;align-items:center;gap:5px;font-style:normal;font:600 11px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;color:rgba(233,229,217,.72)}
.lg-lw em .lg-ic{width:12px;height:12px;flex:0 0 12px;stroke-width:1.8}
.lg-lw b{display:block;margin-top:7px;font:400 22px/1 var(--slab);letter-spacing:-.02em;color:var(--oat)}
.lg-lw b u{text-decoration:none;font:400 11px/1 var(--mono);color:rgba(233,229,217,.66);margin-left:3px}
.lg-sp{flex:1 1 auto;min-height:10px}
.lg-la{background:var(--saff);color:var(--ink);border-radius:22px;padding:12px 15px 14px}
.lg-la__t{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase}
.lg-la__t b{display:flex;align-items:center;gap:6px}
.lg-la__t b .lg-ic{width:13px;height:13px;stroke-width:2}
.lg-la__t span{display:flex;align-items:center;gap:6px}
